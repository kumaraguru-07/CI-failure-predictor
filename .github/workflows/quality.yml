name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  risk:
    name: Advisory failure prediction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-ci.txt
      - name: Predict before required tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_MODEL_URL: ${{ vars.CI_MODEL_URL }}
          CI_MODEL_SHA256: ${{ vars.CI_MODEL_SHA256 }}
        run: python -m src.ci_predict
      - name: Save advisory prediction
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: prediction-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/ci_prediction.json
          if-no-files-found: warn
          retention-days: 90

  tests:
    name: Required tests
    needs: risk
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-ci.txt -r requirements-dashboard.txt
      - run: python -m pytest -q

  outcome:
    name: Record required-test outcome
    needs: [risk, tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Fetch prediction from this run
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: prediction-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports
      - name: Join prediction with actual required-test result
        if: steps.download.outcome == 'success'
        env:
          TEST_RESULT: ${{ needs.tests.result }}
        run: python -m src.ci_history --prediction reports/ci_prediction.json --result "$TEST_RESULT" --export reports/prediction_outcome.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/prediction_outcome.json
            data/ci/predictions.sqlite3
          if-no-files-found: warn
          retention-days: 90

